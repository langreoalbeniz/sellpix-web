<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossier de SellPix</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  /* Plantilla del dossier (8 páginas A4). La rellena scripts/dossier.js con dossier/dossier.md y data/servicios.json. Valores de brand/tokens.css. */
  @page { size: A4; margin: 0; }
  html { color-scheme: light; }
  body { background: var(--color-gray-200); margin: 0; color: var(--color-text); }
  .page { position: relative; width: 210mm; height: 297mm; margin: 0 auto; background: var(--color-surface); color: var(--color-text); overflow: hidden; page-break-after: always; break-after: page; padding: 18mm 18mm 20mm; box-sizing: border-box; display: flex; flex-direction: column; }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page--inverse { background: var(--color-ink); color: var(--color-paper); }
  .page--alt { background: var(--color-surface-alt); }
  @media screen { .page { margin-bottom: var(--space-6); box-shadow: var(--shadow-md); } body { padding: var(--space-6) 0; } }
  @media print { body { background: none; padding: 0; } .page { margin: 0; box-shadow: none; } }

  .eyebrow { font-family: var(--font-pixel); font-size: 11pt; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 var(--space-3); }
  .page--inverse .eyebrow { color: var(--color-paper); opacity: .75; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.025em; line-height: 1.05; }
  h1 { font-size: 34pt; font-weight: 800; letter-spacing: -0.035em; }
  h2 { font-size: 24pt; font-weight: 700; margin-bottom: var(--space-5); }
  h3 { font-size: 13pt; font-weight: 600; letter-spacing: -0.01em; margin-bottom: var(--space-1); }
  p, li { font-family: var(--font-sans); font-size: 10.5pt; line-height: 1.5; margin: 0 0 var(--space-3); }
  .lead { font-size: 13pt; line-height: 1.45; color: var(--color-text-muted); max-width: 150mm; }
  .page--inverse .lead, .page--inverse p { color: var(--color-paper); }
  .page--inverse .lead { opacity: .85; }
  .muted { color: var(--color-text-muted); }
  .small { font-size: 9pt; }
  ul { padding-left: var(--space-4); margin: 0 0 var(--space-4); }
  li { margin-bottom: var(--space-1); }
  .check { list-style: none; padding: 0; }
  .check li { position: relative; padding-left: var(--space-5); }
  .check li::before { content: ""; position: absolute; left: 0; top: .45em; width: 8px; height: 8px; border-radius: 1px; background: var(--color-lime); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }
  .card { background: var(--color-surface-alt); border: 1px solid var(--color-line); border-radius: var(--radius-lg); padding: var(--space-4); }
  .page--alt .card { background: var(--color-surface); }
  .card h3 { margin-bottom: var(--space-2); }
  .card p { margin: 0; }
  .price { font-family: var(--font-display); font-weight: 800; font-size: 22pt; letter-spacing: -0.03em; line-height: 1; margin: var(--space-2) 0 var(--space-1); }
  .price small { display: block; font-family: var(--font-sans); font-weight: 400; font-size: 9pt; letter-spacing: 0; color: var(--color-text-muted); margin: var(--space-1) 0 0; }
  .price small.from { display: inline; margin: 0 var(--space-1) 0 0; }
  .tag { display: inline-block; font-family: var(--font-pixel); font-size: 9pt; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--color-line-strong); border-radius: var(--radius-sm); padding: 2px var(--space-2); color: var(--color-text-muted); }
  .tag--lime { background: var(--color-lime); color: var(--color-on-lime); border-color: var(--color-lime); }
  .shot { border: 1px solid var(--color-line); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
  .shot img { display: block; width: 100%; height: auto; }
  .shots { display: grid; grid-template-columns: 1fr 52mm; gap: var(--space-4); align-items: start; }
  .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--space-3); margin-top: var(--space-5); }
  .steps li { list-style: none; border-top: 2px solid var(--color-text); padding-top: var(--space-3); }
  .steps .n { display: block; font-family: var(--font-display); font-weight: 800; font-size: 16pt; margin-bottom: var(--space-1); }
  .footer { position: absolute; left: 18mm; right: 18mm; bottom: 10mm; display: flex; justify-content: space-between; font-family: var(--font-sans); font-size: 8.5pt; color: var(--color-text-muted); }
  .page--inverse .footer { color: var(--color-paper); opacity: .7; }
  .footer .pixel { display: inline-block; width: 7px; height: 7px; background: var(--color-lime); border-radius: 1px; margin-right: 6px; vertical-align: middle; }
  .stair { display: grid; grid-template-columns: repeat(6, 11mm); grid-auto-rows: 11mm; gap: 2.5mm; }
  .stair span { border-radius: 1.8mm; background: var(--color-paper); opacity: .09; }
  .stair span.on { background: var(--color-lime); opacity: 1; }
  .stair span.hid { visibility: hidden; }
  .logo { height: 9mm; width: auto; display: block; }
  .cover-bottom { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; }
  .spacer { flex: 1; }
  dl.data { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-4); margin: 0; }
  dl.data dt { font-weight: 600; } dl.data dd { margin: 0; }
  .quote { font-family: var(--font-display); font-size: 18pt; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin: var(--space-5) 0; max-width: 150mm; }
  .faq h3 { font-family: var(--font-sans); font-size: 10.5pt; font-weight: 600; letter-spacing: 0; }
  .faq p { margin-bottom: var(--space-3); }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--color-lime); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-3); }
  .plans .card { padding: var(--space-3); }
  .plans .price { font-size: 15pt; margin: var(--space-1) 0; }
  .plans p.small { font-size: 8.5pt; line-height: 1.4; }
  .plans .price small { display: inline; margin: 0 0 0 var(--space-1); }
  .plans p.small { margin: 0; }
</style>
</head>
<body>
{{PAGINAS}}
</body>
</html>
