name: IndexNow

# Avisa a IndexNow (Bing y los buscadores compatibles) de las URLs públicas que han cambiado, justo después de que
# GitHub Pages termine de desplegar con éxito, o a mano con «Run workflow» (opción «todo» = todo el sitemap).
# La clave es pública por diseño (no es una credencial) y está publicada en
# https://sellpix.es/c34d89f7eb43445eb011037759de413f.txt. Si IndexNow no responde 200 o 202, el flujo FALLA (en rojo)
# y deja en el log el código, la respuesta y las URLs enviadas.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      todo:
        description: "Enviar todo el sitemap (si no, solo lo que cambió respecto al despliegue anterior)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  avisar:
    name: Enviar las URLs cambiadas a IndexNow
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: sellpix.es
      KEY: c34d89f7eb43445eb011037759de413f
      ENDPOINT: https://api.indexnow.org/indexnow
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      TODO: ${{ github.event.inputs.todo }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar el repositorio (commit desplegado, con historial)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Calcular las URLs que han cambiado
        id: urls
        run: |
          set +o pipefail
          # Las URLs indexables son exactamente las del sitemap (las páginas noindex no están en él).
          grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#</\?loc>##g' | sort -u > sitemap-urls.txt
          echo "El sitemap tiene $(wc -l < sitemap-urls.txt) URLs."

          # Base de comparación: el despliegue anterior con éxito que sea antecesor del commit desplegado ahora.
          BASE=""
          for sha in $(gh run list -R "$GITHUB_REPOSITORY" --workflow pages-build-deployment --status success -L 15 --json headSha -q '.[].headSha'); do
            if [ "$sha" != "$HEAD_SHA" ] && git cat-file -e "$sha^{commit}" 2>/dev/null && git merge-base --is-ancestor "$sha" "$HEAD_SHA"; then BASE="$sha"; break; fi
          done
          if [ -z "$BASE" ]; then BASE=$(git rev-parse "$HEAD_SHA~1" 2>/dev/null || true); fi

          if [ "$TODO" = "true" ]; then
            echo "Envío manual de todo el sitemap."
            cp sitemap-urls.txt urls.txt
          elif [ -z "$BASE" ]; then
            echo "Sin despliegue anterior con el que comparar: se envía todo el sitemap."
            cp sitemap-urls.txt urls.txt
          else
            git diff --name-only "$BASE" "$HEAD_SHA" > cambios.txt
            echo "Comparando $BASE → $HEAD_SHA: $(wc -l < cambios.txt) archivos cambiados"
            grep -E '(^|/)index\.html$' cambios.txt | sed -E 's#(^|/)index\.html$#\1#' | sed "s#^#https://$HOST/#" | sort -u > candidatas.txt
            if grep -qE '^sitemap\.xml$' cambios.txt; then
              echo "Cambia sitemap.xml: se envía todo el sitemap."
              cp sitemap-urls.txt urls.txt
            elif [ "$(grep -Fxc -f sitemap-urls.txt candidatas.txt)" -ge 12 ]; then
              echo "Cambian 12 páginas HTML o más a la vez: se envía todo el sitemap."
              cp sitemap-urls.txt urls.txt
            else
              # Páginas HTML cambiadas, más las URLs que el sitemap tiene ahora y no tenía en el despliegue anterior.
              git show "$BASE:sitemap.xml" 2>/dev/null | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | sort -u > sitemap-anterior.txt || true
              comm -13 sitemap-anterior.txt sitemap-urls.txt >> candidatas.txt
              # Solo URLs presentes en el sitemap y, por si acaso, nunca confirmar/, gracias/, sobre-mi/, creditos/ ni la 404.
              sort -u candidatas.txt | grep -Fx -f sitemap-urls.txt | grep -vE '/(confirmar|gracias|sobre-mi|creditos)/|404' > urls.txt || true
            fi
          fi
          n=$(grep -c . urls.txt || true)
          if [ "$n" = "0" ]; then echo "Sin URLs de contenido que enviar (css/, js/, brand/ o archivos que no son páginas del sitemap)."; fi
          echo "URLs a enviar: $n"; cat urls.txt
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Comprobar que la clave está publicada
        if: steps.urls.outputs.n != '0'
        run: |
          publicada=$(curl -sS --retry 3 --retry-delay 5 "https://$HOST/$KEY.txt" || true)
          if [ "$publicada" != "$KEY" ]; then
            echo "::error::https://$HOST/$KEY.txt no devuelve la clave (devuelve: '$publicada'). IndexNow rechazaría el envío."
            exit 1
          fi
          echo "La clave está publicada en https://$HOST/$KEY.txt."

      - name: Enviar a IndexNow
        if: steps.urls.outputs.n != '0'
        run: |
          jq -Rn --arg host "$HOST" --arg key "$KEY" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: [inputs | select(length > 0)]}' urls.txt > cuerpo.json
          echo "Endpoint: $ENDPOINT"
          echo "Cuerpo enviado:"; cat cuerpo.json
          for intento in 1 2 3; do
            codigo=$(curl -sS -o respuesta.txt -w "%{http_code}" -X POST "$ENDPOINT" \
              -H "Content-Type: application/json; charset=utf-8" --data-binary @cuerpo.json || echo "000")
            echo "Intento $intento · $(date -u +%Y-%m-%dT%H:%M:%SZ) · IndexNow respondió: $codigo"
            echo "Respuesta: $(cat respuesta.txt 2>/dev/null)"
            case "$codigo" in 200|202) break ;; 000|5??) sleep 10 ;; *) break ;; esac
          done
          n=$(jq '.urlList | length' cuerpo.json)
          case "$codigo" in
            200) echo "OK: IndexNow aceptó $n URLs (200)." ;;
            202) echo "OK: IndexNow aceptó $n URLs (202, pendiente de validar la clave)." ;;
            *) echo "::error::IndexNow respondió $codigo; no se han registrado las $n URLs."; exit 1 ;;
          esac
          { echo "### IndexNow: $codigo · $n URLs"; echo; sed 's/^/- /' urls.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Nada que enviar
        if: steps.urls.outputs.n == '0'
        run: echo "Ninguna URL pública ha cambiado en este despliegue."
